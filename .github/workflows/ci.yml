name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: chronos
          POSTGRES_DB: chronos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chronos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r apps/api/requirements.txt

      - name: Ruff lint
        run: ruff check apps/api/

      - name: Mypy type check
        run: mypy apps/api/ --ignore-missing-imports --no-strict-optional

      - name: Pytest
        env:
          DATABASE_URL: postgresql://chronos:chronos@localhost:5432/chronos
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEE_SERVICE_ACCOUNT_EMAIL: ""
          GEE_SERVICE_ACCOUNT_KEY: ""
        run: pytest apps/api/tests/ -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: chronos-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
